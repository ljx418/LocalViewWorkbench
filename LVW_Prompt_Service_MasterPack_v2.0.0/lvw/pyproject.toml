[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lvw-prompt-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "pillow>=12,<13",
  "pydantic>=2.13,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1"
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["backend"]
